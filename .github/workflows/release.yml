name: Release

# Cut a release by bumping the version in ALL FIVE files, then tagging:
#   package.json + package-lock.json + src-tauri/tauri.conf.json +
#   src-tauri/Cargo.toml + src-tauri/Cargo.lock  (Tauri reads tauri.conf.json for
#   the bundle + updater, so `npm version` alone is NOT enough; a stale Cargo.lock
#   dirties the build tree). `npm install` refreshes package-lock.json + Cargo.lock.
#     git commit -am vX.Y.Z
#     git tag -a vX.Y.Z -m vX.Y.Z   # MUST be annotated: --follow-tags pushes only those
#     git push --follow-tags
#     gh workflow run release.yml --ref vX.Y.Z   # pushing the tag does NOT reliably
#                                                # start a run — dispatch it
# The run does a version-consistency gate + cargo test, then a macOS matrix build
# (Apple Silicon + Intel) that publishes a GitHub Release with the signed &
# notarized .dmg installers and the signed updater manifest (latest.json).
# ClipCork is macOS-only (tray + synthetic paste are macOS-specific), so there is
# no Windows/Linux leg. See RELEASING.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  # Gate: version consistency + tests before anything is built and published.
  checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      # The updater manifest (latest.json) advertises the version from
      # tauri.conf.json, NOT the git tag — so a tag that doesn't match it would
      # publish a release that installed clients never see as an update. Fail
      # fast if they disagree. (Skipped on manual workflow_dispatch, non-tag ref.)
      - name: Verify tag matches every versioned file
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FAIL=""
          check() {
            if [ "$2" != "$TAG" ]; then
              echo "::error::$1 is $2, but the tag is v$TAG"
              FAIL="yes"
            else
              echo "  ok  $1 = $2"
            fi
          }
          check package.json      "$(node -p "require('./package.json').version")"
          check package-lock.json "$(node -p "require('./package-lock.json').version")"
          check tauri.conf.json   "$(node -p "require('./src-tauri/tauri.conf.json').version")"
          check Cargo.toml        "$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/^version = "(.*)"/\1/')"
          check Cargo.lock        "$(grep -A1 '^name = "clipcork"$' src-tauri/Cargo.lock | grep '^version' | head -1 | sed -E 's/^version = "(.*)"/\1/')"
          if [ -n "$FAIL" ]; then
            echo "::error::Version bump is incomplete — every file above must match the tag. See RELEASING.md."
            exit 1
          fi
          echo "version OK: $TAG"
      - name: Install frontend dependencies
        run: npm ci
      - name: Rust tests
        run: cd src-tauri && cargo test

  release:
    needs: checks
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---- macOS code signing + notarization (see RELEASING.md) ----
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # ---- Tauri auto-updater signing (REQUIRED — createUpdaterArtifacts is on;
          #      never regenerate this key or installed apps can't verify updates. See RELEASING.md) ----
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ClipCork ${{ github.ref_name }}"
          releaseBody: "Download ClipCork.app for macOS below (Apple Silicon or Intel). Signed & notarized."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
