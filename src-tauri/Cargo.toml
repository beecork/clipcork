[package]
name = "clipcork"
version = "0.2.0"
description = "ClipCork — a menu-bar clipboard manager for macOS"
authors = ["Beecork"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipcork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
window-vibrancy = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSRunningApplication", "NSWindow", "NSResponder", "NSPanel", "NSPasteboard", "NSColor", "NSVisualEffectView", "NSWorkspace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3.6.1"
core-graphics = "0.25.0"
