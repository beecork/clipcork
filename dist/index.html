<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipCork</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="toolbar">
            <span class="logo">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                ClipCork
            </span>
            <div class="toolbar-actions">
                <button id="searchToggle" class="icon-btn" title="Search">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </button>
                <button id="addToggle" class="icon-btn primary" title="Add snippet">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                </button>
            </div>
        </div>

        <div id="searchBar" class="search-bar hidden">
            <input type="text" id="search" placeholder="Search snippets..." autocomplete="off">
        </div>

        <div id="addPanel" class="add-panel hidden">
            <input type="text" id="title" placeholder="Title">
            <textarea id="content" placeholder="Snippet text..." rows="3"></textarea>
            <div class="add-row">
                <input type="text" id="tag" placeholder="Tag (optional)">
                <button id="saveBtn" class="save-btn">Save</button>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="snippets">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
                Snippets
            </button>
            <button class="tab" data-tab="history">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 8 12 12 14 14"/><circle cx="12" cy="12" r="10"/></svg>
                History
            </button>
            <button class="tab" data-tab="settings">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            </button>
        </div>

        <div id="tabSnippets" class="tab-content active">
            <div id="filters" class="filters hidden"></div>
            <div id="list" class="list"></div>
            <div id="empty" class="empty">
                <p>No snippets yet</p>
                <p class="sub">Press + to add one</p>
            </div>
        </div>

        <div id="tabHistory" class="tab-content">
            <div id="historyList" class="list"></div>
            <div id="historyEmpty" class="empty">
                <p>No clipboard history</p>
                <p class="sub">Copy text to start tracking</p>
            </div>
        </div>

        <div id="tabSettings" class="tab-content">
            <div class="settings-panel">
                <div class="setting-group">
                    <label class="setting-label">Record Clipboard</label>
                    <div class="setting-options" id="recordOptions">
                        <button class="setting-opt" data-rec="on">On</button>
                        <button class="setting-opt" data-rec="off">Off</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label">Clipboard History Limit</label>
                    <div class="setting-options" id="limitOptions">
                        <button class="setting-opt" data-limit="5">5</button>
                        <button class="setting-opt" data-limit="10">10</button>
                        <button class="setting-opt" data-limit="20">20</button>
                        <button class="setting-opt" data-limit="50">50</button>
                    </div>
                </div>
                <div class="setting-group">
                    <label class="setting-label">Data Folder</label>
                    <div class="setting-path" id="dataPath">Loading...</div>
                    <p class="setting-note">Snippets and your clipboard history are stored here as plaintext JSON.</p>
                </div>
                <button class="danger-btn" id="clearHistory">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                    Clear Clipboard History
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
</body>
</html>
